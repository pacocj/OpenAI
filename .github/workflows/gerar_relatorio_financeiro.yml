name: Gerar relatório financeiro

on:
  push:
    paths:
      - 'movimentos*.csv'
      - 'relatorio_financeiro.py'

jobs:
  gerar-financeiro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          pip install pandas

      - name: Executar script financeiro e capturar nome do relatório
        run: |
          # Corre o script e guarda toda a saída em output.txt
          python relatorio_financeiro.py > output.txt

          echo "=== Conteúdo da saída do script ==="
          cat output.txt
          echo "==================================="

          # Extrai o nome do ficheiro gerado pelo script
          RELATORIO=$(grep -oE 'relatorio_financeiro_[0-9_-]+\.txt' output.txt | tail -n 1)

          echo "RELATORIO encontrado: $RELATORIO"

          # Exporta o nome do relatório para os próximos steps (env global do job)
          echo "RELATORIO=$RELATORIO" >> $GITHUB_ENV

      - name: Guardar relatório como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: relatorios_financeiros
          path: ${{ env.RELATORIO }}
