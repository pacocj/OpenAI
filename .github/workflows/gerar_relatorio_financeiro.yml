name: Gerar relatório financeiro

on:
  push:
    paths:
      - 'movimentos*.csv'
      - 'relatorio_financeiro.py'

jobs:
  gerar-financeiro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          pip install pandas matplotlib

      - name: Executar script financeiro e capturar nomes dos ficheiros
        run: |
          python relatorio_financeiro.py > output.txt

          echo "=== Saída do script ==="
          cat output.txt
          echo "======================="

          RELATORIO=$(grep -oE 'relatorio_financeiro_[0-9_-]+\.txt' output.txt | tail -n 1)
          GRAFICO=$(grep -oE 'grafico_despesas_[0-9_-]+\.png' output.txt | tail -n 1)

          echo "RELATORIO=$RELATORIO" >> $GITHUB_ENV
          echo "GRAFICO=$GRAFICO" >> $GITHUB_ENV

      - name: Guardar relatório (.txt) como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: relatorio_financeiro
          path: ${{ env.RELATORIO }}

      - name: Guardar gráfico (.png) como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: grafico_financeiro
          path: ${{ env.GRAFICO }}
